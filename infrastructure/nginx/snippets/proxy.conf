# Shared reverse-proxy settings. $remote_addr is the real client IP (see cloudflare-real-ip.conf);
# X-Forwarded-For is replaced, not appended, so clients cannot inject addresses.
proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header Upgrade           $http_upgrade;
proxy_set_header Connection        $connection_upgrade;

# Timeouts and buffers are set in nginx.conf (http level) so locations can override them.

# The apps set their own security headers (CSP, frame options…); the edge owns HSTS.
proxy_hide_header Strict-Transport-Security;
proxy_hide_header X-Powered-By;
# Set once at the edge (security-headers.conf) instead of twice.
proxy_hide_header X-Content-Type-Options;
