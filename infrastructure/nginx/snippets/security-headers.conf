# Edge security headers. Everything else (CSP, X-Frame-Options, Referrer-Policy,
# Permissions-Policy, noindex on private pages) comes from the applications, which
# know each route. Keep "always" so error responses carry the headers too.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header X-Content-Type-Options "nosniff" always;
