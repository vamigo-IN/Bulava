# Bulava on the server's own Nginx (the one that already serves other sites).
# Rendered with real names by infrastructure/scripts/render-host-nginx.sh and
# installed as /etc/nginx/sites-available/bulava (see docs/deployment.md).
#
# This Nginx terminates TLS (certbot, like the other sites) and hands every
# Bulava hostname to the bulava-nginx container on 127.0.0.1:__BULAVA_HTTP_PORT__,
# which routes to web, admin and api and applies Bulava's limits and headers.
# On purpose there is nothing at http level here (no upstream, map, zone or
# log_format) and no default_server, so this file cannot clash with other sites.
#
# `certbot --nginx --redirect -d ...` later adds the 443 listeners and
# certificate lines to this block, plus an HTTP -> HTTPS redirect block.

server {
    listen 80;
    listen [::]:80;
    server_name __BULAVA_SERVER_NAMES__;

    # Request bodies up to 10 MB (CSV imports); photos and videos upload straight to object storage.
    client_max_body_size 10m;
    # The container already logs every request as JSON, without query strings.
    access_log off;

    # Only if Cloudflare proxies these hostnames (see cloudflare-real-ip.conf):
    # include /etc/nginx/snippets/bulava-cloudflare-real-ip.conf;

    location / {
        proxy_pass http://127.0.0.1:__BULAVA_HTTP_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_connect_timeout 5s;
        # Guest and event exports can take up to two minutes.
        proxy_read_timeout 120s;
        # Response headers can exceed the stock 4 KB buffer (CSP, Next.js preload links); a
        # smaller buffer answers 502 "upstream sent too big header". Same sizes as bulava-nginx.
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;
    }
}
