# Bulava's router: the host's Nginx (TLS, certbot) -> this container -> web / admin / api.
# It serves plain HTTP on port 80 inside the container, published only on
# 127.0.0.1:${BULAVA_HTTP_PORT} (docker-compose.prod.yml), so it never competes with
# other sites for 80/443 on a shared server. See docs/nginx.md.
user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
pid /var/run/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 4096;
  multi_accept on;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # Real client IPs. Only the host's Nginx can reach this container (it is published on
  # 127.0.0.1), and it sends the visitor's address in X-Real-IP. Docker delivers those
  # connections from a bridge gateway address, hence the private ranges.
  set_real_ip_from 127.0.0.1;
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  real_ip_header X-Real-IP;

  log_format main escape=json '{"time":"$time_iso8601","ip":"$remote_addr","host":"$host","method":"$request_method",'
                              '"uri":"$uri","status":$status,"bytes":$body_bytes_sent,"rt":$request_time,'
                              '"urt":"$upstream_response_time","ua":"$http_user_agent","cf_ray":"$http_cf_ray"}';
  # $uri (not $request_uri) keeps query strings, which can carry tokens, out of the logs.
  access_log /dev/stdout main;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  server_tokens off;
  keepalive_timeout 65s;
  types_hash_max_size 4096;
  server_names_hash_bucket_size 128;

  # Request limits. Photos and videos upload straight to object storage with
  # signed URLs, so the app itself only receives small JSON / CSV bodies.
  client_max_body_size 10m;
  client_body_timeout 30s;
  client_header_timeout 15s;
  large_client_header_buffers 4 16k;
  # Slow clients (slowloris and the like): a connection that stops reading is dropped, and its
  # memory is freed at once instead of lingering in FIN_WAIT.
  send_timeout 30s;
  reset_timedout_connection on;

  # Compression (Cloudflare may also compress; this covers direct and internal hops).
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/plain text/css text/xml application/json application/javascript application/xml application/rss+xml image/svg+xml font/woff2;

  # WebSocket upgrade support (live photo wall and future realtime features).
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # Per-client rate limits (the API also rate-limits auth and OTP routes in Redis).
  limit_req_zone $binary_remote_addr zone=api_per_ip:20m rate=20r/s;
  limit_req_zone $binary_remote_addr zone=web_per_ip:20m rate=30r/s;
  # Sign-in, codes and sign-up: plenty for a person, and a flood (credential stuffing, code
  # guessing) is turned away here, before it costs the API any work. The API limits them too.
  limit_req_zone $binary_remote_addr zone=auth_per_ip:10m rate=30r/m;
  limit_req_status 429;
  limit_conn_zone $binary_remote_addr zone=conn_per_ip:20m;

  # Upstream timeouts and buffers (locations may override).
  proxy_connect_timeout 5s;
  proxy_send_timeout    60s;
  proxy_read_timeout    60s;
  proxy_buffers 16 16k;
  proxy_buffer_size 16k;

  # Containers get a new address when they are recreated (every deploy), so the upstreams keep
  # resolving their names through Docker's DNS instead of keeping the address seen at start-up,
  # which turned into 502s. `resolve` needs nginx 1.27.3 or newer and a shared zone.
  resolver 127.0.0.11 valid=10s ipv6=off;

  upstream bulava_web   { zone bulava_web 64k;   server web:3000 resolve;   keepalive 32; }
  upstream bulava_admin { zone bulava_admin 64k; server admin:3001 resolve; keepalive 8; }
  upstream bulava_api   { zone bulava_api 64k;   server api:4000 resolve;   keepalive 32; }

  # Rendered at start-up from templates/bulava.conf.template (the image's default.conf is not loaded).
  include /etc/nginx/conf.d/bulava.conf;
}
