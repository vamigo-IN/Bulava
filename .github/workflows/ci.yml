# Bulava CI (spec §75): lint → typecheck → build → Docker build → security checks.
# The test suites are kept outside this repository and run before each release.
# Deployment lives in deploy.yml and only runs after this workflow succeeds.
name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '9.15.0'

jobs:
  checks:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Workspace packages publish dist/; build them first so apps can typecheck.
      - run: pnpm build:packages
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Build apps
        run: pnpm -r --filter "./apps/**" build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [checks]
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: api, dockerfile: infrastructure/docker/api.Dockerfile, target: runtime, args: '' }
          - { image: migrate, dockerfile: infrastructure/docker/api.Dockerfile, target: migrate, args: '' }
          - { image: web, dockerfile: infrastructure/docker/web.Dockerfile, target: runtime, args: 'web' }
          - { image: admin, dockerfile: infrastructure/docker/admin.Dockerfile, target: runtime, args: 'admin' }
          - { image: worker, dockerfile: infrastructure/docker/worker.Dockerfile, target: runtime, args: 'APP=worker' }
          - { image: media-worker, dockerfile: infrastructure/docker/worker.Dockerfile, target: runtime, args: 'APP=media-worker' }
          - { image: video-worker, dockerfile: infrastructure/docker/video-worker.Dockerfile, target: runtime, args: '' }
    env:
      PUSH: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v4
      # Image names must be lowercase, and the repository owner may not be (vamigo-IN).
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/bulava/${{ matrix.image }}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: args
        name: Build arguments
        # Next.js bakes origins and public keys into the build; they come from repository variables.
        run: |
          {
            echo 'list<<EOF'
            case "${{ matrix.args }}" in
              web)
                echo "API_INTERNAL_URL=http://api:4000"
                echo "STORAGE_PUBLIC_ORIGIN=${{ vars.STORAGE_PUBLIC_ORIGIN }}"
                echo "WEB_ORIGIN=${{ vars.WEB_ORIGIN }}"
                echo "NEXT_PUBLIC_POSTHOG_KEY=${{ vars.NEXT_PUBLIC_POSTHOG_KEY }}"
                echo "NEXT_PUBLIC_POSTHOG_HOST=${{ vars.NEXT_PUBLIC_POSTHOG_HOST }}"
                echo "NEXT_PUBLIC_GA4_ID=${{ vars.NEXT_PUBLIC_GA4_ID }}"
                ;;
              admin)
                echo "API_INTERNAL_URL=http://api:4000"
                echo "STORAGE_PUBLIC_ORIGIN=${{ vars.STORAGE_PUBLIC_ORIGIN }}"
                ;;
              APP=*) echo "${{ matrix.args }}" ;;
            esac
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          build-args: ${{ steps.args.outputs.list }}
          push: ${{ env.PUSH == 'true' }}
          load: ${{ env.PUSH != 'true' }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:${{ github.ref_type == 'tag' && github.ref_name || 'main' }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          provenance: false
      - name: Scan image for known vulnerabilities
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  security:
    name: Dependency and secret checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high
      # The gitleaks CLI scans the whole history; the gitleaks GitHub Action needs a
      # paid licence key on organization repositories.
      - name: Scan the repository for committed secrets
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 git /repo --redact --verbose
