# Bulava CI (spec §75): lint → typecheck → build → Docker build → security checks.
# The test suites are kept outside this repository and run before each release.
# Deployment lives in deploy.yml and only runs after this workflow succeeds.
#
# Actions are on their Node 24 releases, and runners are pinned to an Ubuntu version
# (not ubuntu-latest) so an image change never alters a build without a commit.
# pnpm's version comes from "packageManager" in package.json.
name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  checks:
    name: Lint, typecheck, build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Workspace packages publish dist/; build them first so apps can typecheck.
      - run: pnpm build:packages
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Build apps
        shell: bash
        # The services build in parallel; the two Next.js apps build one after the other, because
        # each downloads every Google Fonts family it uses while it builds (about 20, with a retry
        # window of under a second), and two at once can trip Google's rate limit. A failure is
        # retried once, and its reason is shown on the run page either way.
        run: |
          build() {
            {
              pnpm -r --filter "./apps/**" --filter '!@bulava/web' --filter '!@bulava/admin' build &&
                pnpm --filter @bulava/web build &&
                pnpm --filter @bulava/admin build
            } 2>&1 | tee build.log
            return "${PIPESTATUS[0]}"
          }
          annotate() { sed -e 's/%/%25/g' -e 's/\r//g' | awk 'BEGIN{ORS="%0A"} {print}'; }
          if ! build; then
            echo "::warning title=App build failed; retrying once::$(grep -E -i 'error|failed|ERR_PNPM|heap' build.log | tail -n 15 | annotate)"
            if ! build; then
              echo "::error title=App build failed::$(tail -n 40 build.log | annotate)"
              exit 1
            fi
          fi
        env:
          NEXT_TELEMETRY_DISABLED: '1'

  docker:
    name: Docker images
    runs-on: ubuntu-24.04
    needs: [checks]
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: api, dockerfile: infrastructure/docker/api.Dockerfile, target: runtime, args: '' }
          - { image: migrate, dockerfile: infrastructure/docker/api.Dockerfile, target: migrate, args: '' }
          - { image: web, dockerfile: infrastructure/docker/web.Dockerfile, target: runtime, args: 'web' }
          - { image: admin, dockerfile: infrastructure/docker/admin.Dockerfile, target: runtime, args: 'admin' }
          - { image: worker, dockerfile: infrastructure/docker/worker.Dockerfile, target: runtime, args: 'APP=worker' }
          - { image: media-worker, dockerfile: infrastructure/docker/worker.Dockerfile, target: runtime, args: 'APP=media-worker' }
          - { image: video-worker, dockerfile: infrastructure/docker/video-worker.Dockerfile, target: runtime, args: '' }
    env:
      PUSH: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v7
      # Image names must be lowercase, and the repository owner may not be (vamigo-IN).
      # A step output (not $GITHUB_ENV) so editors and linters can resolve every reference to it.
      - id: image
        name: Image name
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/bulava/${{ matrix.image }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: args
        name: Build arguments
        # Next.js bakes origins and public keys into the build; they come from repository variables.
        # A variable that is not set is left out, so the Dockerfile's default applies.
        run: |
          arg() { if [ -n "$2" ]; then echo "$1=$2"; fi; }
          case "${{ matrix.args }}" in
            web | admin)
              [ -n "${{ vars.STORAGE_PUBLIC_ORIGIN }}" ] || echo "::warning::Repository variable STORAGE_PUBLIC_ORIGIN is not set; the ${{ matrix.image }} image uses the Dockerfile default."
              ;;
          esac
          if [ "${{ matrix.args }}" = web ] && [ -z "${{ vars.WEB_ORIGIN }}" ]; then
            echo "::warning::Repository variable WEB_ORIGIN is not set; the web image uses the Dockerfile default (https://bulava.in). Set it and re-run before deploying."
          fi
          {
            echo 'list<<EOF'
            case "${{ matrix.args }}" in
              web)
                echo "API_INTERNAL_URL=http://api:4000"
                arg STORAGE_PUBLIC_ORIGIN "${{ vars.STORAGE_PUBLIC_ORIGIN }}"
                arg WEB_ORIGIN "${{ vars.WEB_ORIGIN }}"
                arg NEXT_PUBLIC_POSTHOG_KEY "${{ vars.NEXT_PUBLIC_POSTHOG_KEY }}"
                arg NEXT_PUBLIC_POSTHOG_HOST "${{ vars.NEXT_PUBLIC_POSTHOG_HOST }}"
                arg NEXT_PUBLIC_GA4_ID "${{ vars.NEXT_PUBLIC_GA4_ID }}"
                ;;
              admin)
                echo "API_INTERNAL_URL=http://api:4000"
                arg STORAGE_PUBLIC_ORIGIN "${{ vars.STORAGE_PUBLIC_ORIGIN }}"
                ;;
              APP=*) echo "${{ matrix.args }}" ;;
            esac
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          build-args: ${{ steps.args.outputs.list }}
          push: ${{ env.PUSH == 'true' }}
          load: ${{ env.PUSH != 'true' }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:${{ github.ref_type == 'tag' && github.ref_name || 'main' }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          provenance: false
      - name: Scan image for known vulnerabilities
        # Pinned to a commit: the action's tags were republished in 2026 (0.28.0 no longer resolves).
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.name }}:${{ github.sha }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  security:
    name: Dependency and secret checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      # No install here (the audit reads the lockfile), so no dependency cache: saving one for a
      # store that does not exist fails the job, and setup-node would otherwise cache automatically
      # because package.json names its package manager.
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high
      # The gitleaks CLI scans the whole history; the gitleaks GitHub Action needs a
      # paid licence key on organization repositories.
      - name: Scan the repository for committed secrets
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 git /repo --redact --verbose
